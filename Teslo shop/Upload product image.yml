info:
  name: Upload product image
  type: http

http:
  method: POST
  url: http://localhost:3000/api/files/product
  auth: inherit

body:
  mode: multipartForm
  multipartForm:
    - name: file
      type: file
      value: []
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
